<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Conexa | Edit Profile</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<header class="navbar">

    <div class="logo">
        Con<span>exa</span>
    </div>


    <nav>

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('artisan_dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </nav>
    

</header>
<div class="page-back">
    <button
        onclick="history.back()"
        class="back-arrow"
    >
        <span class="arrow-icon">←</span>
        <span>Back</span>
    </button>
</div>



<div class="form-container">


    <div class="form-header">

        <h1>
            Edit Your Profile
        </h1>

        <p>
            Keep your information up to date so customers
            can easily find and contact you.
        </p>

    </div>



    <form method="POST">


        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ artisan['name'] or '' }}"
                required
            >

        </div>



        <div class="form-group">

            <label for="service">
                Service
            </label>

            <input
                type="text"
                id="service"
                name="service"
                value="{{ artisan['service'] or '' }}"
                required
            >

        </div>



        <div class="form-group">

            <label for="phone">
                Phone Number
            </label>

            <input
                type="text"
                id="phone"
                name="phone"
                value="{{ artisan['phone'] or '' }}"
                required
            >

        </div>



        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ artisan['email'] or '' }}"
            >

            <small>
                Email address is optional.
            </small>

        </div>



        <div class="form-group">

            <label for="country">
                Country
            </label>

            <select
                id="country"
                name="country"
                required
            >

                <option value="">
                    Select country
                </option>

                <option
                    value="Nigeria"
                    {% if artisan['country'] == 'Nigeria' %}
                        selected
                    {% endif %}
                >
                    Nigeria
                </option>

                <option
                    value="Ghana"
                    {% if artisan['country'] == 'Ghana' %}
                        selected
                    {% endif %}
                >
                    Ghana
                </option>

                <option
                    value="Kenya"
                    {% if artisan['country'] == 'Kenya' %}
                        selected
                    {% endif %}
                >
                    Kenya
                </option>

                <option
                    value="South Africa"
                    {% if artisan['country'] == 'South Africa' %}
                        selected
                    {% endif %}
                >
                    South Africa
                </option>

                <option
                    value="United Kingdom"
                    {% if artisan['country'] == 'United Kingdom' %}
                        selected
                    {% endif %}
                >
                    United Kingdom
                </option>

                <option
                    value="United States"
                    {% if artisan['country'] == 'United States' %}
                        selected
                    {% endif %}
                >
                    United States
                </option>

                <option
                    value="Canada"
                    {% if artisan['country'] == 'Canada' %}
                        selected
                    {% endif %}
                >
                    Canada
                </option>

            </select>

        </div>



        <div class="form-group">

            <label for="state_region">
                State / Region
            </label>

            <select
                id="state_region"
                name="state_region"
                required
            >

                <option value="">
                    Select state / region
                </option>

            </select>

        </div>



        <div class="form-group">

            <label for="city_area">
                City / Area
            </label>

            <input
                type="text"
                id="city_area"
                name="city_area"
                value="{{ artisan['city_area'] or '' }}"
                placeholder="Example: Yaba"
                required
            >

        </div>



        <div class="form-group">

            <label for="location">
                Local Area Description
            </label>

            <input
                type="text"
                id="location"
                name="location"
                value="{{ artisan['location'] or '' }}"
                placeholder="Example: Yaba, Lagos"
                required
            >

        </div>



        <div class="form-group">

            <label for="experience">
                Years of Experience
            </label>

            <input
                type="text"
                id="experience"
                name="experience"
                value="{{ artisan['experience'] or '' }}"
                placeholder="Example: 5 years"
                required
            >

        </div>



        <button
            type="submit"
            class="primary-button"
        >
            Save Changes
        </button>


    </form>



    <a
        href="{{ url_for('artisan_dashboard') }}"
        class="back-link"
    >
        ← Back to Dashboard
    </a>


</div>



<script>


const regions = {

    "Nigeria": [

        "Abia",
        "Adamawa",
        "Akwa Ibom",
        "Anambra",
        "Bauchi",
        "Bayelsa",
        "Benue",
        "Borno",
        "Cross River",
        "Delta",
        "Ebonyi",
        "Edo",
        "Ekiti",
        "Enugu",
        "Gombe",
        "Imo",
        "Jigawa",
        "Kaduna",
        "Kano",
        "Katsina",
        "Kebbi",
        "Kogi",
        "Kwara",
        "Lagos",
        "Nasarawa",
        "Niger",
        "Ogun",
        "Ondo",
        "Osun",
        "Oyo",
        "Plateau",
        "Rivers",
        "Sokoto",
        "Taraba",
        "Yobe",
        "Zamfara",
        "Federal Capital Territory"

    ],


    "Ghana": [

        "Greater Accra",
        "Ashanti",
        "Central",
        "Eastern",
        "Northern",
        "Western",
        "Volta",
        "Bono",
        "Bono East",
        "Ahafo",
        "Savannah",
        "North East",
        "Upper East",
        "Upper West",
        "Western North",
        "Oti"

    ],


    "Kenya": [

        "Nairobi",
        "Mombasa",
        "Kisumu",
        "Nakuru",
        "Kiambu",
        "Machakos",
        "Kajiado",
        "Uasin Gishu"

    ],


    "South Africa": [

        "Gauteng",
        "Western Cape",
        "KwaZulu-Natal",
        "Eastern Cape",
        "Free State",
        "Limpopo",
        "Mpumalanga",
        "Northern Cape",
        "North West"

    ],


    "United Kingdom": [

        "England",
        "Scotland",
        "Wales",
        "Northern Ireland"

    ],


    "United States": [

        "California",
        "Texas",
        "Florida",
        "New York",
        "Georgia",
        "Illinois",
        "Washington"

    ],


    "Canada": [

        "Ontario",
        "Quebec",
        "British Columbia",
        "Alberta",
        "Manitoba",
        "Saskatchewan"

    ]

};



const countrySelect =
    document.getElementById("country");


const stateSelect =
    document.getElementById("state_region");


const currentState =
    "{{ artisan['state_region'] or '' }}";



function updateRegions() {

    const country =
        countrySelect.value;


    stateSelect.innerHTML =
        '<option value="">Select state / region</option>';


    if (!country || !regions[country]) {

        stateSelect.disabled = true;

        return;

    }


    stateSelect.disabled = false;


    regions[country].forEach(function(region) {

        const option =
            document.createElement("option");


        option.value =
            region;


        option.textContent =
            region;


        if (region === currentState) {

            option.selected = true;

        }


        stateSelect.appendChild(option);

    });

}



countrySelect.addEventListener(
    "change",
    updateRegions
);


updateRegions();


</script>


</body>

</html>
