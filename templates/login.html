<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Conexa | Artisan Login</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="logo">Con<span>exa</span></div>

      <a href="/"> Home </a>
    </nav>

    <!-- BACK BUTTON -->
    <div class="page-back">
      <button onclick="history.back()" class="back-arrow">
        <span class="arrow-icon"> ← </span>

        <span> Back </span>
      </button>
    </div>

    <!-- LOGIN -->
    <section class="form-section">
      <div class="form-container login-container">
        <div class="form-header">
          <p class="small-heading">WELCOME BACK</p>

          <h1>Sign In to Conexa</h1>

          <p>
            Sign in to manage your artisan profile, service requests, and
            account.
          </p>
        </div>

        <!-- LOGIN FORM -->
        <form method="POST" action="{{ url_for('login') }}">
          <div class="form-group">
            <label for="phone"> Phone Number </label>

            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="Enter your phone number"
              required
            />
          </div>

          <!-- PASSWORD -->
          <div class="form-group">
            <label for="password"> Password </label>

            <div class="password-input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
              />

              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword()"
                aria-label="Show password"
              >
                👁
              </button>
            </div>
          </div>

          <button type="submit" class="primary-button">Sign In</button>
        </form>

        <p class="form-note">
          Don't have an artisan account?

          <a href="{{ url_for('register') }}"> Create an account </a>
        </p>
      </div>
    </section>

    <!-- FOOTER -->
    <footer>
      <div class="logo">Con<span>exa</span></div>

      <p>Connecting you with skilled artisans.</p>

      <p class="copyright">© 2026 Conexa</p>
    </footer>

    <!-- PASSWORD TOGGLE -->
    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("password");

        const toggleButton = document.querySelector(".password-toggle");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";

          toggleButton.textContent = "🙈";

          toggleButton.setAttribute("aria-label", "Hide password");
        } else {
          passwordInput.type = "password";

          toggleButton.textContent = "👁";

          toggleButton.setAttribute("aria-label", "Show password");
        }
      }
    </script>
  </body>
</html>
